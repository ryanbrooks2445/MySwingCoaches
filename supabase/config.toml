# Supabase local development config
# Run: supabase start (requires Supabase CLI)
# See README.md for cloud setup via supabase link + db push

project_id = "abljgrtgttbekqrrelln"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "100MiB"

# Local `supabase start` only — cloud projects: disable in Dashboard → Auth → Email
[auth.email]
enable_confirmations = false
